name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and bundle
        run: npm run build
      - name: Check public release hygiene
        run: npm run check:public
        env:
          # The generic CI account name collides with a source variable used in tests.
          USER: ''
      - name: Run logic smoke tests
        run: npm run smoke:logic
      - name: Verify package contents
        run: npm run check:pack
